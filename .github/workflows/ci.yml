name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 17 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Cache test-data
        id: cache-test-data
        uses: actions/cache@v4
        with:
          path: test-data
          key: test-data-${{ hashFiles('test-data/**/*.meta') }}
          restore-keys: test-data-

      - name: Download large test data
        if: steps.cache-test-data.outputs.cache-hit != 'true'
        run: |
          if command -v pwsh &> /dev/null; then
            pwsh test-data/download-test-data.ps1
          else
            git clone --depth 1 https://github.com/jinyurrr/rtklib-java-data.git /tmp/rtklib-java-data
            for subdir in rinex nav rtcm product reference nmea config tle; do
              if [ -d "/tmp/rtklib-java-data/$subdir" ]; then
                mkdir -p "test-data/$subdir"
                cp -n /tmp/rtklib-java-data/$subdir/* "test-data/$subdir/" 2>/dev/null || true
              fi
            done
            rm -rf /tmp/rtklib-java-data
          fi

      - name: Build
        run: mvn -B compile

      - name: Test
        run: mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/'
          retention-days: 7